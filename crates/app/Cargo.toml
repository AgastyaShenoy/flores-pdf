[package]
name = "flores-pdf"
version.workspace = true
edition.workspace = true

[[bin]]
# like SumatraPDF.exe
name = "FloresPDF"
path = "src/main.rs"

[dependencies]
engine.workspace = true
render.workspace = true
softbuffer.workspace = true
winit.workspace = true
memmap2.workspace = true
# unpacks the PDFium built into the exe: the version the engine already uses
miniz_oxide = "0.8.9"
# PNG export of pages: the version vello_cpu already pulls in
png = "0.18.1"
# UI drawing: the same versions hayro's renderer uses
kurbo = "0.13.0"
skrifa = "0.46.2"
vello_cpu = { version = "0.3", default-features = false, features = ["std", "png", "u8_pipeline"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
miniz_oxide = "0.8.9"
