[workspace]
resolver = "3"
members = ["crates/*"]
# the benchmarks are separate projects with their own lockfiles
exclude = ["bench"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
engine = { path = "crates/engine" }
render = { path = "crates/render" }
memmap2 = "0.9"
softbuffer = "0.4.8"
winit = "0.30"

[profile.release]
opt-level = 3
# one unit, optimized across crates: a smaller, quicker exe for a slower build
lto = "fat"
codegen-units = 1
